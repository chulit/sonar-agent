<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
    <linearGradient id="sonar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B9FD5" />
      <stop offset="100%" stop-color="#1F6FEB" />
    </linearGradient>
    <linearGradient id="ai-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" />
      <stop offset="100%" stop-color="#8957E5" />
    </linearGradient>
    <linearGradient id="success-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FB950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="320" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Title -->
  <text x="440" y="38" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    ⚡ Turn SonarQube Quality Gate Failures into 1-Click AI Fixes
  </text>
  <text x="440" y="58" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
    Seamless closed-loop remediation from ambient editor status to autonomous AI code fixes
  </text>

  <!-- STEP 1: Ambient Status & Detection -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="240" height="195" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect width="240" height="32" rx="8" fill="#21262d" />
    <circle cx="16" cy="16" r="4" fill="#f85149" />
    <circle cx="28" cy="16" r="4" fill="#d29922" />
    <circle cx="40" cy="16" r="4" fill="#3fb950" />
    <text x="120" y="21" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="600">1. Ambient Awareness</text>

    <!-- Status Bar Item Mockup -->
    <rect x="15" y="46" width="210" height="28" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1" />
    <text x="25" y="65" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">⊗</text>
    <text x="40" y="65" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Sonar: Failed</text>
    <text x="155" y="65" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Quality Gate</text>

    <!-- Metrics Badges -->
    <g transform="translate(15, 88)">
      <rect width="98" height="42" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="8" y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">RELIABILITY</text>
      <text x="8" y="34" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">5 Bugs</text>
      <rect x="74" y="10" width="16" height="16" rx="3" fill="#da3633" />
      <text x="82" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">C</text>

      <rect x="112" y="0" width="98" height="42" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="120" y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">SECURITY</text>
      <text x="120" y="34" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">3 Vulns</text>
      <rect x="186" y="10" width="16" height="16" rx="3" fill="#da3633" />
      <text x="194" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">D</text>
    </g>

    <!-- Demo Mode Button -->
    <rect x="15" y="145" width="210" height="26" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1" />
    <text x="120" y="162" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">
      ⚡ Try Demo Mode (Instant Preview)
    </text>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(280, 170)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,2" />
    <polygon points="30,-4 38,0 30,4" fill="#58a6ff" />
  </g>

  <!-- STEP 2: Enriched Prompt Dispatcher -->
  <g transform="translate(325, 85)" filter="url(#shadow)">
    <rect width="245" height="195" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect width="245" height="32" rx="8" fill="#21262d" />
    <text x="122" y="21" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="600">2. Enriched Fix Prompt</text>

    <!-- Rule & Context Card -->
    <rect x="15" y="46" width="215" height="88" rx="4" fill="#0d1117" stroke="#30363d" />
    <text x="25" y="64" fill="#79c0ff" font-family="monospace" font-size="10" font-weight="600">typescript:S3776</text>
    <text x="25" y="79" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Cognitive Complexity is 18 (max 15)</text>
    <line x1="25" y1="87" x2="215" y2="87" stroke="#21262d" />
    <text x="25" y="101" fill="#8b949e" font-family="monospace" font-size="9">+ File: src/services/Payment.ts:42</text>
    <text x="25" y="114" fill="#8b949e" font-family="monospace" font-size="9">+ Local code snippet (10 lines context)</text>
    <text x="25" y="126" fill="#8b949e" font-family="monospace" font-size="9">+ Sonar remediation advice &amp; rationale</text>

    <!-- Action Button -->
    <rect x="15" y="145" width="215" height="26" rx="4" fill="url(#sonar-blue)" />
    <text x="122" y="162" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">
      ⚡ Fix with AI Agent
    </text>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(580, 170)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,2" />
    <polygon points="30,-4 38,0 30,4" fill="#a371f7" />
  </g>

  <!-- STEP 3: Multi-Agent Resolution & Green Quality Gate -->
  <g transform="translate(620, 85)" filter="url(#shadow)">
    <rect width="230" height="195" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect width="230" height="32" rx="8" fill="#21262d" />
    <text x="115" y="21" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="600">3. Autonomous Fix &amp; Pass</text>

    <!-- Supported AI Agents List -->
    <g transform="translate(15, 46)">
      <rect width="95" height="22" rx="3" fill="#21262d" />
      <text x="47" y="15" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Copilot Chat</text>

      <rect x="105" width="95" height="22" rx="3" fill="#21262d" />
      <text x="152" y="15" text-anchor="middle" fill="#4285F4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Antigravity</text>

      <rect y="28" width="95" height="22" rx="3" fill="#21262d" />
      <text x="47" y="43" text-anchor="middle" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Claude Code</text>

      <rect x="105" y="28" width="95" height="22" rx="3" fill="#21262d" />
      <text x="152" y="43" text-anchor="middle" fill="#10A37F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Codex / Cline</text>
    </g>

    <!-- Result Banner: Quality Gate Passed -->
    <g transform="translate(15, 110)">
      <rect width="200" height="62" rx="4" fill="#0f2d18" stroke="#238636" stroke-width="1" />
      <circle cx="25" cy="31" r="12" fill="#238636" />
      <text x="25" y="36" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">✓</text>
      <text x="48" y="26" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Quality Gate Passed</text>
      <text x="48" y="42" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">0 Bugs · 0 Vulns · A-Rating</text>
      <text x="48" y="54" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">$(pass) Sonar: Passed</text>
    </g>
  </g>
</svg>
